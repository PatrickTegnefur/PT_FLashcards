<svg viewBox="0 0 340 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .line { stroke:#100e28; stroke-width:3; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .right-angle { stroke:#100e28; stroke-width:2.5; fill:none; }
    .hyp { stroke:#EC6095; stroke-width:4; fill:none; stroke-linecap:round; }
    .arrow { fill:#EC6095; }
    .lbl { font-family:'Sora',sans-serif; font-size:16px; fill:#100e28; font-weight:600; }
    .lbl-hyp { font-family:'Sora',sans-serif; font-size:16px; fill:#EC6095; font-weight:700; }
  </style>
  <!-- Rätvinklig triangel -->
  <polyline class="line" points="40,200 40,40 260,200" />
  <!-- Hypotenusan, markerad -->
  <line class="hyp" x1="40" y1="40" x2="260" y2="200" />
  <!-- Rät vinkel-markering -->
  <polyline class="right-angle" points="40,180 60,180 60,200" />
  <!-- Pil som pekar mot hypotenusan -->
  <line class="hyp" x1="220" y1="60" x2="175" y2="95" />
  <polygon class="arrow" points="175,95 190,90 183,104" />
  <!-- Etiketter -->
  <text class="lbl" x="14" y="120">a</text>
  <text class="lbl" x="140" y="222">b</text>
  <text class="lbl-hyp" x="205" y="52">c (hypotenusa)</text>
</svg>
